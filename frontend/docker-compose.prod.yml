version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: edsa_postgres
    environment:
      POSTGRES_USER: edsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edsa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - edsa_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edsa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edsa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edsa_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edsa_backend
    environment:
      - DATABASE_URL=postgresql://edsa:${POSTGRES_PASSWORD}@postgres:5432/edsa_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=False
      - CURRENCY_CODE=SLL
      - EXCHANGE_RATE=20000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edsa_network
    restart: always
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edsa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - edsa_network
    restart: always

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  edsa_network:
    driver: bridge